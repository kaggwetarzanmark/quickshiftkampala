<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="#0B1626"/>

  <!-- Truck body -->
  <rect x="6" y="24" width="34" height="20" rx="3" fill="#FF7A1A"/>

  <!-- Cab -->
  <rect x="40" y="29" width="18" height="15" rx="3" fill="#FF7A1A"/>

  <!-- Cab window -->
  <rect x="43" y="31" width="10" height="7" rx="2" fill="#0B1626" opacity="0.7"/>

  <!-- Connector between body and cab -->
  <rect x="38" y="30" width="4" height="13" fill="#FF7A1A"/>

  <!-- Truck undercarriage -->
  <rect x="6" y="42" width="52" height="4" rx="1" fill="#e55a00"/>

  <!-- Rear wheel -->
  <circle cx="16" cy="48" r="5" fill="#1a2f4a"/>
  <circle cx="16" cy="48" r="2.5" fill="#9fb0c8"/>

  <!-- Front wheel -->
  <circle cx="48" cy="48" r="5" fill="#1a2f4a"/>
  <circle cx="48" cy="48" r="2.5" fill="#9fb0c8"/>

  <!-- Speed lines on truck body -->
  <rect x="10" y="30" width="16" height="2" rx="1" fill="#fff" opacity="0.25"/>
  <rect x="10" y="35" width="24" height="2" rx="1" fill="#fff" opacity="0.15"/>
</svg>
